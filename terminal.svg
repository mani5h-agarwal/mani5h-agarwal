<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="macOS terminal showing what Manish cares about: reliable, scalable mobile applications; performance, optimization, system-level understanding; clean UI backed by solid architecture; learning by building and breaking things">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .user { fill: #39d353; font-weight: 600; }
    .path { fill: #58a6ff; font-weight: 600; }
    .dim { fill: #8b949e; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #a0a6ad; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset="1" stop-color="#2b2d31"/>
    </linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="798" height="268" rx="11"/></clipPath>
    <clipPath id="type">
      <rect x="24" y="60" width="162" height="26">
        <animate attributeName="width" from="162" to="390" begin="0.4s" dur="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="800" height="270" fill="#16181d"/>
    <rect width="800" height="38" fill="url(#bar)"/>
    <rect y="38" width="800" height="1" fill="#000"/>
    <circle cx="22" cy="19" r="6.5" fill="#ff5f57"/>
    <circle cx="42" cy="19" r="6.5" fill="#febc2e"/>
    <circle cx="62" cy="19" r="6.5" fill="#28c840"/>
    <text class="title" x="400" y="24">manish — zsh — 80×24</text>
  </g>

  <text class="user" x="24" y="78">manish@github</text><text class="path" x="150" y="78">~</text><text class="dim" x="168" y="78">%</text>
  <text x="186 195 204 213 222 231 240 249 258 267 276 285 294 303 312 321 330 339 348 357 366 375 384 393 402" y="78" clip-path="url(#type)">cat what_i_care_about.txt</text>

  <rect y="64" width="9" height="18" fill="#e6edf3" opacity="0">
    <set attributeName="opacity" to="0.85" begin="0s"/>
    <set attributeName="opacity" to="0" begin="1.6s"/>
    <animate attributeName="x" from="186" to="411" begin="0.4s" dur="1.1s" fill="freeze"/>
    <set attributeName="x" to="186" begin="0s" end="0.4s"/>
  </rect>

  <g opacity="0"><set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
    <text x="24" y="106"><tspan class="user">&gt;</tspan> reliable, scalable mobile applications</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2s" fill="freeze"/>
    <text x="24" y="132"><tspan class="user">&gt;</tspan> performance, optimization, system-level understanding</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/>
    <text x="24" y="158"><tspan class="user">&gt;</tspan> clean UI backed by solid architecture</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
    <text x="24" y="184"><tspan class="user">&gt;</tspan> learning by building and breaking things</text></g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="2.7s" fill="freeze"/>
    <text class="user" x="24" y="222">manish@github</text><text class="path" x="150" y="222">~</text><text class="dim" x="168" y="222">%</text>
    <rect x="186" y="208" width="9" height="18" fill="#e6edf3">
      <animate attributeName="opacity" values="0.85;0.85;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="799" height="269" rx="11.5" fill="none" stroke="#4a4e55"/>
</svg>
